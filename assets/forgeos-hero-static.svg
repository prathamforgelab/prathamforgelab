<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ForgeOS — static Pratham Forge Labs banner</title>
  <desc id="desc">A static charcoal engineering banner with electric blue and cyan accents, introducing Pratham Forge Labs and its AI and software engineering focus.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14" />
      <stop offset="1" stop-color="#101b29" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#67e8f9" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#45627f" stroke-opacity=".16" stroke-width="1" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#background)" stroke="#25374a" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="336" rx="23" fill="url(#grid)" />
  <circle cx="975" cy="171" r="225" fill="#0e7490" fill-opacity=".15" />
  <path d="M62 92h78" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" />
  <circle cx="148" cy="92" r="4" fill="#67e8f9" />
  <text x="62" y="75" fill="#a5c9e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">PRATHAM FORGE LABS / 01</text>
  <text x="62" y="151" fill="#f2f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">Build ideas into</text>
  <text x="62" y="210" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">engineered systems.</text>
  <text x="66" y="256" fill="#d0dfed" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="1.2">AI ENGINEER  /  SOFTWARE ENGINEER</text>
  <text x="66" y="293" fill="#8ba5bd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="2">LLM EVALUATION  ·  CLOUD SYSTEMS  ·  APPLIED AI</text>
  <circle cx="971" cy="171" r="112" fill="#0b1119" fill-opacity=".62" stroke="#294663" stroke-width="1.5" />
  <ellipse cx="971" cy="171" rx="147" ry="49" transform="rotate(-34 971 171)" fill="none" stroke="url(#accent)" stroke-opacity=".65" stroke-width="1.5" />
  <path d="M971 112 1022 141v60l-51 30-51-30v-60z" fill="#101b28" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M946 146h49l-10 13h-24v12h23l-10 13h-13v24h-15z" fill="#e6f7ff" />
  <text x="971" y="281" fill="#b8cce0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="3">FORGEOS / SYSTEM PROFILE</text>
  <path d="M1111 56v24m-12-12h24" stroke="#4da6d9" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="1123" cy="269" r="2" fill="#67e8f9" />
</svg>
